<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="kbT kbD" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title id="kbT">Krishna Priyadarshan Behara</title>
<desc id="kbD">ML Engineer working on medical imaging and IoT security. Final-year CSE at VIT Chennai.</desc>
<defs>
  <linearGradient id="kbBg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#10070C"/>
    <stop offset="0.55" stop-color="#190B12"/>
    <stop offset="1" stop-color="#451126"/>
    <animate attributeName="x1" values="0;0.25;0" dur="18s" repeatCount="indefinite"/>
  </linearGradient>
  <radialGradient id="kbGlow" cx="0.82" cy="0.42" r="0.55">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0.85"/>
    <stop offset="0.6" stop-color="#451126" stop-opacity="0.25"/>
    <stop offset="1" stop-color="#10070C" stop-opacity="0"/>
    <animate attributeName="cx" values="0.82;0.74;0.82" dur="14s" repeatCount="indefinite"/>
  </radialGradient>
  <linearGradient id="kbLine" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
    <stop offset="0.35" stop-color="#C77B9B"/>
    <stop offset="0.7" stop-color="#E5B5C7"/>
    <stop offset="1" stop-color="#E5B5C7" stop-opacity="0"/>
  </linearGradient>
  <linearGradient id="kbUnder" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#701A3D" stop-opacity="0"/>
    <stop offset="0.3" stop-color="#C77B9B"/>
    <stop offset="0.6" stop-color="#E5B5C7"/>
    <stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
  </linearGradient>
  <pattern id="kbGrid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#C77B9B" stroke-opacity="0.09" stroke-width="0.6"/>
  </pattern>
  <radialGradient id="kbFade" cx="0.7" cy="0.5" r="0.75">
    <stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
  </radialGradient>
  <mask id="kbGridMask"><rect width="1200" height="420" fill="url(#kbFade)"/></mask>
  <filter id="kbBlur" x="-20%" y="-200%" width="140%" height="500%"><feGaussianBlur stdDeviation="5"/></filter>
  <filter id="kbSoft" x="-10%" y="-50%" width="120%" height="200%"><feGaussianBlur stdDeviation="2.2"/></filter>
</defs>

<rect width="1200" height="420" fill="url(#kbBg)"/>
<rect width="1200" height="420" fill="url(#kbGlow)"/>
<rect width="1200" height="420" fill="url(#kbGrid)" mask="url(#kbGridMask)"/>

<!-- orbital geometry -->
<g transform="translate(900 190)" fill="none" stroke="#C77B9B">
  <circle r="150" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle r="104" stroke-opacity="0.14" stroke-width="0.8" stroke-dasharray="2 7"/>
  <circle r="58" stroke-opacity="0.22" stroke-width="0.8"/>
  <g>
    <ellipse rx="190" ry="62" stroke-opacity="0.30" stroke-width="0.9" transform="rotate(-24)"/>
    <circle r="4" fill="#E5B5C7" stroke="none" transform="rotate(-24)" >
      <animateMotion dur="46s" repeatCount="indefinite" path="M190 0 A190 62 0 1 1 -190 0 A190 62 0 1 1 190 0"/>
    </circle>
    
  </g>
  <circle r="3" fill="#E5B5C7" stroke="none" cx="0" cy="-104">
    <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="64s" repeatCount="indefinite"/>
  </circle>
  <circle r="2.5" fill="#C77B9B" stroke="none" cx="58" cy="0">
    <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="28s" repeatCount="indefinite"/>
  </circle>
</g>

<!-- signal trace: the memorable element -->
<g fill="none" stroke-linecap="round" stroke-linejoin="round">
  <path d="M0 304 L120 304 C170 304 200 296 250 296 C300 296 330 304 380 304 L640 304 C660 304 668 296 688 296 C708 296 716 304 736 304 L772 304 L788 322 L814 230 L842 350 L862 304 L910 304 C940 304 952 282 980 282 C1008 282 1020 304 1052 304 L1200 304" stroke="#C77B9B" stroke-opacity="0.16" stroke-width="1"/>
  <path d="M0 304 L120 304 C170 304 200 296 250 296 C300 296 330 304 380 304 L640 304 C660 304 668 296 688 296 C708 296 716 304 736 304 L772 304 L788 322 L814 230 L842 350 L862 304 L910 304 C940 304 952 282 980 282 C1008 282 1020 304 1052 304 L1200 304" stroke="url(#kbLine)" stroke-width="5" filter="url(#kbBlur)" opacity="0.55" pathLength="1000" stroke-dasharray="260 740">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="9s" repeatCount="indefinite"/>
  </path>
  <path d="M0 304 L120 304 C170 304 200 296 250 296 C300 296 330 304 380 304 L640 304 C660 304 668 296 688 296 C708 296 716 304 736 304 L772 304 L788 322 L814 230 L842 350 L862 304 L910 304 C940 304 952 282 980 282 C1008 282 1020 304 1052 304 L1200 304" stroke="url(#kbLine)" stroke-width="1.8" pathLength="1000" stroke-dasharray="260 740">
    <animate attributeName="stroke-dashoffset" from="1000" to="0" dur="9s" repeatCount="indefinite"/>
  </path>
</g>

<!-- type -->
<g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,'Times New Roman',serif">
  <text x="72" y="128" font-size="62" font-weight="400" fill="#F8F0F3" letter-spacing="0.5">Krishna Priyadarshan</text>
  <text x="72" y="196" font-size="62" font-weight="400" font-style="italic" fill="#E5B5C7" letter-spacing="0.5">Behara</text>
</g>
<g font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,'Courier New',monospace" font-size="16" fill="#C77B9B">
  <text x="72" y="244" letter-spacing="1.2">ML engineer, medical imaging and IoT security</text>
</g>
<g font-family="'Iowan Old Style','Palatino Linotype',Palatino,Georgia,serif" font-size="15" font-style="italic" fill="#E5B5C7" fill-opacity="0.65">
  <text x="72" y="376">Final-year CSE, VIT Chennai</text>
</g>

<!-- glowing underline -->
<g>
  <rect x="72" y="262" width="340" height="3" rx="1.5" fill="url(#kbUnder)" filter="url(#kbSoft)" opacity="0.9"/>
  <rect x="72" y="263" width="340" height="1.2" rx="0.6" fill="url(#kbUnder)"/>
  <circle cy="263.6" r="2.4" fill="#F8F0F3"><animate attributeName="cx" values="72;412;72" dur="7s" repeatCount="indefinite" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><animate attributeName="opacity" values="0.2;1;0.2" dur="7s" repeatCount="indefinite"/></circle>
</g>
<rect x="0.5" y="0.5" width="1199" height="419" fill="none" stroke="#C77B9B" stroke-opacity="0.12"/>
</svg>